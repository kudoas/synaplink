[package]
name = "synaplink"
version = "0.1.0"
description = "A local-first linked-note app"
authors = ["kudoas"]
edition = "2021"
publish = false

[lib]
name = "synaplink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Transitive dependency versions are outside this crate's control.
multiple_crate_versions = "allow"
# This private desktop application is not published as a crates.io package.
cargo_common_metadata = "allow"
# Tauri command handlers must own deserialized arguments and framework state handles.
needless_pass_by_value = "allow"
